name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Transition: Rust runtime is still released until the sunset gate
  # (issue #34 Phase 5) passes. Remove this job with Cargo.toml.
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout 5m
      - run: go vet ./...
      - run: go test ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: shellcheck -S warning toolchains/*.sh toolchains/lib/scan.sh tests/toolchains_test.sh scripts/install.sh scripts/build-and-upload.sh
      - run: bash tests/toolchains_test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run typecheck
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
